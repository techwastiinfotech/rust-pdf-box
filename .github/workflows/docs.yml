name: Documentation & GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation & Rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build mdBook Handbook
        run: mdbook build book -d target/book

      - name: Build Rustdoc API Documentation
        run: cargo doc --no-deps --all-features

      - name: Integrate Rustdoc into Book Site
        run: |
          mkdir -p target/book/api
          cp -r target/doc/* target/book/api/
          cat << 'EOF' > target/book/api/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=rust_pdf_box/index.html">
            <title>Redirecting to rust-pdf-box API Documentation...</title>
          </head>
          <body>
            <p>Redirecting to <a href="rust_pdf_box/index.html">rust-pdf-box API documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
