name: Release & Publish Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_crates_io:
        description: 'Publish crate to crates.io (requires CARGO_REGISTRY_TOKEN secret)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pdfbox-linux-x86_64
            binary_name: pdfbox
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pdfbox-windows-x86_64
            binary_name: pdfbox.exe
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pdfbox-macos-x86_64
            binary_name: pdfbox
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pdfbox-macos-aarch64
            binary_name: pdfbox
            archive_ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin pdfbox --target ${{ matrix.target }}

      - name: Package Binary Archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          cp "$BIN_PATH" dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C dist .
          shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Package Binary Archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination dist/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"
          (Get-FileHash -Path "${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact_name }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload Binary Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256
          retention-days: 30

  package-crate:
    name: Package Crate & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Crate Package (.crate)
        run: cargo package --verbose

      - name: Build API Documentation
        run: cargo doc --no-deps --all-features

      - name: Archive Documentation
        shell: bash
        run: |
          cd target/doc
          zip -r ../../rust-pdf-box-docs.zip .
          cd ../..
          shasum -a 256 rust-pdf-box-docs.zip > rust-pdf-box-docs.zip.sha256

      - name: Upload Crate Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crate-distribution-package
          path: |
            target/package/*.crate
            rust-pdf-box-docs.zip
            rust-pdf-box-docs.zip.sha256
          retention-days: 30

      - name: Publish to Crates.io
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_crates_io == 'true') && env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  create-github-release:
    name: Create GitHub Release
    needs: [build-binaries, package-crate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p final-assets
          find release-artifacts/ -type f -exec cp {} final-assets/ \;
          ls -lah final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
