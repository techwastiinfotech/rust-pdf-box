name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Run All Examples
        run: |
          cargo run --example quickstart
          cargo run --example stamping_demo
          cargo run --example digital_signature_demo
          cargo run --example form_processing_demo
          cargo run --example merge_split_demo
          cargo run --example extract_text_demo

      - name: Build CLI Binary
        run: cargo build --release --bin pdfbox

      - name: Upload Development Binary Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ matrix.os }}
          path: |
            target/release/pdfbox
            target/release/pdfbox.exe
          if-no-files-found: ignore
          retention-days: 14

  package-check:
    name: Package & Docs Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Crate Packaging
        run: cargo package --verbose

      - name: Verify Documentation Build
        run: cargo doc --no-deps --all-features

      - name: Upload Crate Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dev-crate-package
          path: target/package/*.crate
          retention-days: 14
