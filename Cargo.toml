[package]
name = "rust-pdf-box"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
chrono = "0.4"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ttf-parser = "0.25"
rsa = "0.9"
der = "0.7"
rand = "0.8"
